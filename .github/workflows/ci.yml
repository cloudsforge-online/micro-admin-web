# Continuous integration.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# THE `check` AND `image` JOBS BELOW ARE TEMPORARY, exactly as they are in `micro-hub-web`. The
# org's reusable `web-ci.yml` is the target and the `hygiene` job already calls the org repository;
# the two local jobs exist for one reason and disappear with it:
#
#   @cloudsforge/ui is unpublished, and this repository consumes it as `link:../ui/packages/ui`.
#   The reusable workflow does a single checkout and then `pnpm install --frozen-lockfile`, which
#   cannot resolve a sibling directory that is not there. The day the design system is published
#   and the specifier in package.json becomes `^1.0.0`, everything from `check:` to the end of
#   `image:` is deleted and replaced by:
#
#     jobs:
#       ci:
#         uses: cloudsforge-online/micro-org/.github/workflows/web-ci.yml@main
#         with:
#           app: admin-web
#           deep-link-path: /approvals/3f2a1b9c-4d5e-4f60-8a1b-2c3d4e5f6071
#         permissions:
#           contents: read
#           packages: read
#
#   — the calling convention in `org/templates/web/_github/workflows/ci.yml`. The measured target
#   in docs/ecosystem/03 §5 is zero repositories with a bespoke CI file, so treat every line from
#   `check:` down as a liability with a deletion date rather than as something to extend.
#
# ONE INPUT OF THE REUSABLE WORKFLOW WILL STILL NOT SUIT THIS REPOSITORY: its `image` job probes a
# deep route and requires a 200 for ANY address. This console's nginx.conf enumerates its real
# routes and answers 404 for everything else ON PURPOSE. So `build-image: false` will be passed and
# the image is checked here, where the probe can assert the honest answer as well as the deep link.
#
# `deep-link-path` is `/approvals/<uuid>` — a REAL route, declared as a wildcard in
# `src/lib/routes.ts` and exported as `DEEP_LINK_PATH`, which `test/routes.test.ts` checks this
# file against. A probe against a path the app does not own proves only that the 404 page renders.
#
# ── BOTH REASONS ABOVE ARE NOW OUT OF DATE, AND THE CONCLUSION STILL HOLDS ───────────────────────
#
# Re-checked against micro-org rather than believed:
#
#   * the single checkout is fixed. web-ci.yml:88-115 checks the app out into `app/`, micro-ui into
#     `ui/` beside it, and installs THE SIBLING FIRST, because `link:` resolves to the sibling's own
#     node_modules — the shape of the `check:` job below. micro-ui is public now, so even the
#     `estate_token` fallback to `github.token` resolves.
#   * the deep-route probe is fixed, and inverted. web-ci.yml:290-297 REQUIRES an unknown path to
#     answer 404 and names `try_files $uri /index.html` as the thing not to do; the 200 is now asked
#     only of the optional `deep-link-path` input (:299-309), a route the app really has.
#
# So the two things that made a bespoke `check:` and `image:` unavoidable are gone. This file is
# still not deleted, because what remains is not a workaround: `rules:` (line 145 below) was
# never claimed to be temporary — re-read the first line of this header, it names `check` and
# `image` — and web-ci.yml has no input that could carry it. Its `runtime-hosts` job checks VITE_*,
# build arguments, third-party analytics and the README. It cannot check
#   that this console never posts to the audit mirror intake (line 207),
#   or that no act-as-anyone parameter (line 219).
#
# Migrating would delete assertions to save a checkout that is already written. What was genuinely
# missing was a PRODUCER — nothing here ever pushed the image it built — and that is what the
# `publish` job at the end of this file adds.
# ────────────────────────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, 'design-system/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: admin-web }

      # Temporary, for the same reason as the Dockerfile's second build context: the design system
      # is unpublished and resolves through `link:../ui/packages/ui`.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          # micro-ui is private; without a contents:read token this checkout 404s and the job dies
          # before install. Same wiring as the service repos' runtime checkout.
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      # Pinned, because the checkout lives at admin-web/ and the action looks for the
      # packageManager field in the workspace root, where there is no package.json.
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: admin-web/pnpm-lock.yaml }

      # `link:` resolves to the sibling's own node_modules, so the design system must be installed
      # before this repository is — without this, `tsc` cannot resolve ../ui's own imports (react,
      # react/jsx-runtime) when it typechecks the linked sources.
      - name: Install the sibling design system
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install
        working-directory: admin-web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: admin-web
        run: pnpm typecheck

      - name: Test
        working-directory: admin-web
        run: pnpm test

      - name: Build
        working-directory: admin-web
        run: pnpm build

      # A frontend that builds to nothing is a blank page, not a build failure. The previous estate
      # served SPAs from the API process and shipped an image with no dist in it.
      - name: The bundle exists
        working-directory: admin-web
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html is missing after a successful build"; exit 1; }
          echo "ok: $(find dist -type f | wc -l | tr -d ' ') files in dist"

      # The favicons must survive the BUILD as well as be present in the source tree.
      # test/brand-chrome.test.ts asserts the source; this asserts the artefact, because Vite
      # copies publicDir at build time and a misconfigured publicDir would pass the first and fail
      # the second.
      - name: The brand chrome reached the bundle
        working-directory: admin-web
        run: |
          set -euo pipefail
          for icon in favicon-32x32.png favicon-192x192.png favicon-512x512.png; do
            test -f "dist/$icon" || { echo "::error::dist/$icon is missing — the tab will show the browser's blank-page glyph"; exit 1; }
          done
          echo "ok: the favicons are in dist"

  rules:
    name: Estate rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No build-time configuration
        # The same rule as test/no-build-time-config.test.ts, checked again here so it fails even
        # if somebody deletes the test along with the line it forbids. A `VITE_` variable is read
        # at build time and frozen into the artefact, and an artefact with an environment frozen
        # into it has to be rebuilt to be promoted — which means the thing that reaches production
        # is not the thing that passed CI.
        run: |
          set -uo pipefail
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.html' \
               -e 'import\.meta\.env' -e 'VITE_' src index.html; then
            echo "::error::this bundle must read no build-time environment; hosts come from cloudsforgeHosts() at runtime"
            exit 1
          fi
          echo "ok: no build-time environment"

      - name: No hard-coded CloudsForge hostname
        # A literal hostname is a second, unversioned copy of the surface registry, and the copy is
        # the one that will be wrong.
        run: |
          set -uo pipefail
          if grep -rn --include='*.ts' --include='*.tsx' 'cloudsforge\.online' src; then
            echo "::error::resolve hosts through cloudsforgeHosts() rather than naming them"
            exit 1
          fi
          echo "ok: no literal hostnames in src"

      - name: The SPA fallback keeps its 404
        # Comments are stripped first. nginx.conf's own header QUOTES the directive it forbids, in
        # order to explain why the routes are enumerated by hand, so a grep over the raw file
        # matches the warning and fails a correct config. (The web template's copy of this step
        # does exactly that, and fails on its own pristine nginx.conf.)
        run: |
          set -uo pipefail
          directives=$(grep -v '^[[:space:]]*#' nginx.conf)
          if printf '%s\n' "$directives" | grep -nE 'try_files[[:space:]]+\$uri[[:space:]]+(\$uri/[[:space:]]+)?/index\.html'; then
            echo "::error::unknown paths must 404; serve the shell through error_page 404 /index.html"
            exit 1
          fi
          # `grep -q PATTERN <<<"$var"` rather than `printf '%s\n' "$var" | grep -q PATTERN`.
          # grep -q exits on its first match by design; the producer then writes into a closed pipe,
          # and `pipefail` promoted that SIGPIPE (exit 141) to a failed step — a gate that failed for
          # no reason and passed on re-run, which teaches re-running instead of reading. The here-string
          # is byte-identical input with the same exit status and no pipe, so the rule is unchanged.
          grep -q 'error_page 404 /index.html' <<<"$directives"
          echo "ok: unknown paths answer 404"

      - name: The auth callback is redeemed before the app renders
        # The hand-off code has to leave the address bar before the exchange goes over the wire,
        # and that only happens if bootstrapSession() runs before React mounts.
        run: grep -q 'bootstrapSession' src/main.tsx

      - name: The route table, the navigation and nginx agree
        # Already asserted by test/routes.test.ts; repeated here so deleting the test does not
        # silently delete the rule.
        run: test -f test/routes.test.ts && grep -q 'nginx.conf' test/routes.test.ts

      - name: This console never posts to the audit mirror intake
        # POST /v1/events is signature-checked against OUTBOX_SIGNING_SECRET and needs the exact
        # admin:audit:write scope. A browser holds neither. A client that appeared to offer it
        # would be offering a forgery endpoint for the record disputes are settled against.
        run: |
          set -uo pipefail
          if grep -rnE "api<[^>]*>\(\s*[\`'\"]/v1/events" src; then
            echo "::error::/v1/events is the estate audit mirror intake and must never be called from a browser"
            exit 1
          fi
          echo "ok: the audit mirror intake is not reachable from this bundle"

      - name: No act-as-anyone parameter
        # The frozen estate's /internal routes took a userId as a PARAMETER, which is an
        # act-as-anyone primitive; deploy/gateway/dynamic/policy.yml refuses them from outside for
        # exactly that reason. Nothing in this console may grow an equivalent: admin-api derives
        # every actor from the verified bearer.
        run: |
          set -uo pipefail
          if grep -rnE "(onBehalfOf|actAs|impersonat)" --include='*.ts' --include='*.tsx' src; then
            echo "::error::an operator acts as themselves; this console has no act-as primitive"
            exit 1
          fi
          echo "ok: no act-as-anyone primitive"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: admin-web }
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: admin-web
          build-contexts: uipkg=ui
          build-args: RELEASE=${{ github.sha }}
          push: false
          load: true
          tags: admin-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PROBED, NOT READ. Both defects this step guards were invisible in the config and obvious in
      # a response: nginx's `add_header` is all-or-nothing per level, so a location that sets
      # Cache-Control silently loses every inherited security header; and `try_files` is a file
      # lookup rather than an internal redirect, so serving /index.html from `location = /` never
      # enters `location = /index.html`. Reading the file suggests both are fine. Curling it does
      # not.
      - name: The image serves the console, 404s what it does not own, and sends the headers it promises
        run: |
          set -uo pipefail
          docker run -d --name ci-admin-web -p 127.0.0.1:8080:8080 admin-web:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "${code:-}" = "200" ] || { echo "::error::the image returned ${code:-no answer} for /"; docker logs --tail 60 ci-admin-web; exit 1; }

          fail=0

          # A route this console OWNS must survive a hard refresh. The path is DEEP_LINK_PATH in
          # src/lib/routes.ts, and test/routes.test.ts checks this file against it.
          deep=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/approvals/3f2a1b9c-4d5e-4f60-8a1b-2c3d4e5f6071 || true)
          [ "$deep" = "200" ] || { echo "::error::an owned route returned $deep — it must be served the shell"; fail=1; }

          # And a THREE-segment route, which is new as of the Foresight fold (P13). Every wildcard
          # this console had before was two segments, so the nginx block had never been exercised
          # past one level of nesting. `/foresight/markets/<uuid>` is the address an operator pastes
          # into a chat window for a second pair of eyes before resolving a market — followed cold,
          # in a fresh tab, which is precisely the request a client-side router serves and nginx has
          # never heard of. FORESIGHT_DEEP_LINK_PATH in src/lib/routes.ts; same test checks it.
          deep3=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/foresight/markets/3f2a1b9c-4d5e-4f60-8a1b-2c3d4e5f6071 || true)
          [ "$deep3" = "200" ] || { echo "::error::the foresight deep link returned $deep3 — a pasted market link must survive a hard refresh"; fail=1; }

          # A route it does NOT own must answer 404 while still serving the shell, so the reader
          # gets a real page and the status line tells the truth. This is the assertion the org's
          # reusable image job cannot make, because it requires a 200 for any deep link.
          unknown=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope/not/a/route || true)
          [ "$unknown" = "404" ] || { echo "::error::an unknown address returned $unknown; it must be 404"; fail=1; }
          curl -s -m 5 http://127.0.0.1:8080/nope/not/a/route | grep -q '<div id="root">' \
            || { echo "::error::the 404 did not serve the app shell"; fail=1; }

          check() { # url, header, expected-substring, label
            got=$(curl -sI "$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2- || true)
            case "${got:-}" in
              "") echo "::error::$4 is missing $2"; fail=1 ;;
              *"$3"*) echo "  ok   $4: $2: $got" ;;
              *) echo "::error::$4 has the wrong $2 (got '${got:-nothing}', wanted '$3')"; fail=1 ;;
            esac
          }

          asset=$(curl -s http://127.0.0.1:8080/ | grep -oE '/assets/[^"]+\.js' | head -1)
          for target in "http://127.0.0.1:8080/" "http://127.0.0.1:8080/approvals" "http://127.0.0.1:8080$asset"; do
            [ -n "$asset" ] || [ "$target" != "http://127.0.0.1:8080" ] || continue
            check "$target" X-Content-Type-Options "nosniff" "$target"
            # DENY, not SAMEORIGIN: an operator console inside any frame is a clickjacking surface
            # for a session that can authorise a ledger reversal.
            check "$target" X-Frame-Options "DENY" "$target"
            check "$target" Referrer-Policy "strict-origin" "$target"
            check "$target" X-Robots-Tag "noindex" "$target"
          done
          check "http://127.0.0.1:8080/" Cache-Control "no-store" "the shell"
          check "http://127.0.0.1:8080/approvals" Cache-Control "no-store" "an enumerated route"
          [ -n "$asset" ] && check "http://127.0.0.1:8080$asset" Cache-Control "immutable" "a hashed asset"

          # The favicons are served by the image, not merely committed to the repository. The web
          # template's Dockerfile does not copy public/ into the build context, so every frontend
          # cut from it ships an image with no icon in it while its own brand test passes.
          for icon in favicon-32x32.png favicon-192x192.png; do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$icon" || true)
            [ "$code" = "200" ] || { echo "::error::/$icon returned $code from the image"; fail=1; }
          done

          docker rm -f ci-admin-web >/dev/null 2>&1 || true
          exit $fail
      - name: Down
        if: always()
        run: docker rm -f ci-admin-web || true

  hygiene:
    # The org's reusable secret check. Cheap, and it catches the failure that cannot be undone: a
    # secret pushed to a repository is compromised the moment it lands, and rotating it is the only
    # remedy.
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ────────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. Until this job existed the `image:` job above built this image and threw
  # it away, so the release path could not name it. Every line number below was read off the source,
  # not off the prose that cites it — the numbers in micro-org's own publish-image.yml header have
  # already drifted:
  #
  #   generator  `cfctl release` pins one image per deployable, the name from
  #              org/tools/registry.ts:367-369 (`ghcr.io/<org>/<repo.repo>`, which is why the package
  #              is micro-<app> and not <app>) and the tag from that repository's package.json
  #              version, org/tools/cfctl.ts:962-968.
  #   verifier   `cfctl release --verify` runs `docker manifest inspect` on EVERY entry and returns
  #              non-zero if one cannot be pulled, org/tools/cfctl.ts:997-1038.
  #   deployer   deploy/scripts/release-deploy.sh:99-124 refuses to change anything while any image
  #              is missing.
  #
  # A frontend with no producer was therefore a manifest entry that could never verify.
  #
  # `packages: write` IS GRANTED HERE and not asked for inside the shared workflow, which is forced
  # rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or reduced, never
  # elevated, so a reusable workflow asking for a permission its caller withheld fails the run at
  # STARTUP, before a step runs. Measured on micro-org: run 30900277471 (caller capped at
  # `packages: read`) ended in startup_failure; run 30900280323 (same workflow, caller granting
  # `packages: write`) succeeded. That is also why `push: false` stays in the `image:` job above —
  # that job is a GATE and needs `load:` so it can boot the container and probe it. This is the
  # producer. Different purposes, so different jobs.
  #
  # `needs:` names EVERY other job, so nothing is published that did not pass every gate here.
  # ────────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [check, rules, image, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/design-system/'))
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      # `web`, so the producer checks micro-ui out as the `uipkg` named build context this
      # repository's Dockerfile reads at line 24. It names ONLY the contexts its kind checked
      # out, because buildx stats every named context before it opens the Dockerfile.
      kind: web
    secrets:
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
