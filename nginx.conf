# The operator console's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. That makes a "page not found" screen a success: search engines index
# it, uptime checks call it healthy, link checkers pass, and a deploy that drops a route looks
# exactly like a deploy that did not.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and `ROUTES` in src/lib/routes.ts must agree. That is one line per
# route, paid once per route, and `test/routes.test.ts` reads this file and fails the build when
# they drift. "Remember to update nginx.conf" is not a mechanism; a test is.
#
# ──────────────────────────────────────────────────────────────────────────────────────────────
# THIS CONFIG DOES NOT MAKE THE CONSOLE OPERATOR-ONLY, AND MUST NOT BE MISTAKEN FOR THE THING
# THAT DOES.
#
# It serves static files. It has no session, no token and no view of who is asking. Keeping this
# console off the public internet is the gateway's job and the README says exactly what it must
# enforce; `admin-api` verifying the `admin` role on every request is the last line. What this
# file contributes is narrower and worth having: no caching of the shell, no framing, and a
# `X-Robots-Tag` so that anything which does reach it does not end up in an index.
# ──────────────────────────────────────────────────────────────────────────────────────────────

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ───────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it — a
# conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui/surfaces, and test/sitemap.test.ts reads that
# export and fails when this alternation has drifted from it. They are the words that name an
# environment rather than a surface: `surfaces.ts` reserves them so no surface may take one as a
# subdomain.
#
# `(?:[^.]+-)?` catches BOTH shapes. The environment is a suffix on the first label now
# (`admin-testnet.<apex>`) and was an apex prefix before (`testnet.<apex>`, which put this console
# at the two-label `admin.testnet.<apex>` — unreachable, because Cloudflare's Universal SSL is a
# one-label wildcard and every two-label name fails the handshake at the edge).
#
# ON THIS SURFACE IT CHANGES NOTHING AND IS KEPT ANYWAY. Both branches of every use below answer
# the same way, because an operator console refuses every crawler in every environment — see the
# two locations at the bottom of the server block. It is here because it is the estate's shared
# mechanism and a test asserts it matches the registry: a config that carries the map and does not
# need it is a config the next person can extend; a config that omits it is one where the omission
# looks like a decision about crawling that nobody made.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # DENY rather than SAMEORIGIN. Every other frontend in the estate uses SAMEORIGIN because it
    # has legitimate same-origin embeds; this one has none, and an operator console inside any
    # frame is a clickjacking surface for a session that can authorise a ledger reversal.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location below that
        # sets Cache-Control must restate the security headers, or it silently serves without them
        # — which is exactly what `location /assets/` did in the template, stripping nosniff from
        # every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts. test/routes.test.ts reads both.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
    }

    # `foresight` was added when its operator panel folded in at P13. It is a WILDCARD route and
    # the `(/|$)` above is what makes that work for three segments as well as two: this block
    # serves the shell for /foresight, /foresight/markets and /foresight/markets/<uuid> alike,
    # which is what a hard refresh on a pasted market link depends on.
    #
    # `backups` is a wildcard for the same reason: /backups/<uuid> is the address one operator
    # sends another when they need a live restore approved, so it is followed COLD, in a fresh tab,
    # by somebody who was not already on the page — which is exactly the path a client-side router
    # serves perfectly and nginx has never heard of.
    location ~ ^/(approvals|actions|audit|support|mail|engagement|flags|broadcasts|backups|foresight|worlds)(/|$) {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate them all.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- robots.txt, and the sitemap this surface refuses to have --------
    #
    # ══════════════════════════════════════════════════════════════════════════════════════════
    # THIS CONSOLE IS NOT INDEXED, AND THE DECISION IS THE REGISTRY'S RATHER THAN THIS FILE'S.
    #
    # `admin`'s row carries `adminOnly: true` (ui/packages/ui/src/surfaces.ts:340). Three things
    # follow from that one field and none of them is decided here:
    #
    #   - `robotsDirective()` returns `noindex, nofollow` (ui/packages/ui/src/seo.ts:139-140),
    #     which is the first half of the `<meta name="robots">` in index.html;
    #   - `SITEMAP_SURFACES` filters this surface out of the ESTATE sitemap that `site` serves
    #     (ui/packages/ui/src/sitemap.ts:48), so nothing anywhere advertises this address;
    #   - and `robotsTxt({ indexable: false })` composes the body below.
    #
    # test/sitemap.test.ts derives all three from the registry and fails when any drifts. That is
    # what "derive the exclusion" buys: flipping `adminOnly` would move every one of them together,
    # and no edit to this file can move one without the others.
    #
    # ── BOTH HALVES ARE NEEDED AND NEITHER IS SUFFICIENT ──────────────────────────────────────
    #
    # `robots.txt` stops the FETCH and the meta tag stops the INDEXING. A page that is only
    # disallowed can still be indexed from an inbound link, with a search result reading "no
    # information is available for this page" — which for an operator console is a search result
    # that confirms the console exists, at its address, which is the entire disclosure. The
    # `X-Robots-Tag` header at the top of this block is the third, and it is the one that covers a
    # response a crawler received without executing any JavaScript.
    #
    # ── WHY THIS LOCATION EXISTS AT ALL, WHEN public/ COULD HOLD A FILE ───────────────────────
    #
    # public/ HELD NO robots.txt, so `/robots.txt` fell through to `location /`, 404'd, and
    # `error_page 404 /index.html` answered it with the app shell — a crawler asking this console
    # what it may crawl was handed 12KB of HTML and a 404, which every crawler reads as "there are
    # no rules here". The absent file was the permissive answer.
    #
    # It is a location rather than a file for the reason the sitemap block below records: nothing
    # built in this repository may name a hostname (test/no-build-time-config.test.ts), and nginx
    # has `$host` on every request. This body names none, so a file would have done — but keeping
    # the pair in one place is what lets one test read both.
    # ══════════════════════════════════════════════════════════════════════════════════════════
    location = /robots.txt {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.txt` in the URI to `text/plain` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type text/plain;
        # REPEATED, NOT INHERITED: a location that declares any add_header inherits none.
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        # UNCONDITIONAL, and that is the difference between this surface and a public one. On
        # `site` and on the product surfaces this body is the non-mainnet branch and `Allow: /` is
        # the mainnet one. Here there is no mainnet branch: an operator console refuses every
        # crawler in every environment, so `$cf_env` is not consulted. There is no `Sitemap:` line
        # for the same reason — a robots.txt that disallows everything and then names an index of
        # what it disallowed has published the list.
        return 200 'User-agent: *
Disallow: /
';
    }

    # /sitemap.xml, WHICH THIS SURFACE DOES NOT HAVE.
    #
    # An explicit 404 rather than nothing, because "nothing" here means `location /`, which means
    # `error_page 404 /index.html`, which means a crawler asking for this console's sitemap is
    # served the console's own shell. The status is honest either way; the body is not, and a body
    # that is the operator console is the one body this address must never return.
    #
    # There is deliberately no sitemap to serve. The estate one omits this surface already
    # (sitemap.ts:48), and a per-surface one would be an index of an operator console's addresses,
    # published at a well-known path, on the surface whose whole posture is that its addresses are
    # not public. `/approvals/<uuid>` and `/backups/<uuid>` are not merely unlisted — they are the
    # identifiers of privileged actions in flight.
    location = /sitemap.xml {
        access_log off;
        return 404;
    }

    # ---- everything else -------------------------------------------------
    # A real file (a favicon) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the console works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
